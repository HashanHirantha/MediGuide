name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - "!Frontend/.expo/**"
      - "!Frontend/**/*.md"

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run pre-update checks
        run: |
          npm run lint
          npm run type-check

      - name: Publish OTA update
        run: eas update --branch production --message "$(git log -1 --pretty=%B)" --non-interactive
